# Vertex AI CustomJob spec: baseline IDM-VTON (pretrained yisol/IDM-VTON, no extension, no measurements)
# on the same FIT data used for the extensions. Uses inference_measurement_adapter.py without --checkpoint_dir.
#
# Usage:
#   gcloud ai custom-jobs create \
#       --region=europe-west4 \
#       --display-name=idm-vton-baseline-inference \
#       --config=inference_job_baseline.yaml
#
# Prerequisites: upload to gs://idm-vton-ma/scripts/
#   - inference_measurement_adapter.py
#   - gradio_demo/utils_mask_original.py  (upstream IDM-VTON mask code, from the first repo commit)
#
# Results are uploaded to gs://idm-vton-ma/baseline_run/inference_output/.

workerPoolSpecs:
  - machineSpec:
      machineType: a2-highgpu-1g
      acceleratorType: NVIDIA_TESLA_A100
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 200
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/vton-ma/idm-vton/trainer:v7
      command:
        - /bin/bash
        - -c
        - |
          set -e

          BUCKET="idm-vton-ma"
          OUTPUT_PREFIX="baseline_run/inference_output"

          export BUCKET

          pip install --quiet google-cloud-storage==2.14.0 google-cloud-logging==3.9.0

          python - <<'PYEOF'
          from google.cloud import storage
          import os, pathlib, sys

          bucket_name = os.environ["BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          def download_prefix(prefix, local_root):
              prefix = prefix.rstrip("/") + "/"
              blobs = list(bucket.list_blobs(prefix=prefix))
              if not blobs:
                  print(f"ERROR: no objects found under gs://{bucket_name}/{prefix}", file=sys.stderr)
                  sys.exit(1)
              for blob in blobs:
                  rel = blob.name[len(prefix):]
                  if not rel:
                      continue
                  dest = pathlib.Path(local_root) / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  blob.download_to_filename(str(dest))
                  print(f"  downloaded {blob.name}")
              print(f"Done: {local_root}  ({len(blobs)} files)")

          download_prefix("datasets/inference_test", "/tmp/inference_test")
          download_prefix("models/yisol-IDM-VTON", "/tmp/yisol-IDM-VTON")
          download_prefix("scripts", "/tmp/scripts")
          PYEOF

          cp /tmp/scripts/inference_measurement_adapter.py /app/inference_measurement_adapter.py
          cp /tmp/scripts/utils_mask_original.py /app/gradio_demo/utils_mask_original.py

          # Wire up /app/ckpt/* so hardcoded relative paths in humanparsing,
          # openpose, and densepose all resolve correctly.
          mkdir -p /app/ckpt
          ln -sfn /tmp/yisol-IDM-VTON/humanparsing  /app/ckpt/humanparsing
          ln -sfn /tmp/yisol-IDM-VTON/densepose     /app/ckpt/densepose
          ln -sfn /tmp/yisol-IDM-VTON/openpose      /app/ckpt/openpose

          cd /app
          # No --checkpoint_dir -> pretrained model, measurements ignored.
          # --original_mask -> upstream IDM-VTON agnostic mask (no measurement-based expansion).
          # Resolution/steps/seed match the adapter inference job for a fair comparison.
          accelerate launch \
            --num_processes=1 \
            --num_machines=1 \
            inference_measurement_adapter.py \
            --pretrained_model_name_or_path /tmp/yisol-IDM-VTON \
            --data_dir /tmp/inference_test \
            --output_dir /tmp/baseline_inference_output \
            --num_samples -1 \
            --height 1024 \
            --width 768 \
            --mixed_precision fp16 \
            --num_inference_steps 30 \
            --guidance_scale 2.0 \
            --seed 42 \
            --original_mask \
            --densepose_path /tmp/yisol-IDM-VTON/densepose/model_final_162be9.pkl

          export OUTPUT_PREFIX
          python - <<'PYEOF'
          from google.cloud import storage
          import os, pathlib, sys

          out_dir = pathlib.Path("/tmp/baseline_inference_output")
          if not out_dir.exists():
              print("WARNING: inference output directory not found — inference may have failed.", file=sys.stderr)
              sys.exit(1)
          prefix = os.environ["OUTPUT_PREFIX"].strip("/")
          bucket_name = os.environ["BUCKET"]
          bucket = storage.Client().bucket(bucket_name)
          uploaded = 0
          for f in out_dir.rglob("*"):
              if f.is_file():
                  rel = f.relative_to(out_dir)
                  blob_name = f"{prefix}/{rel}".replace("\\", "/")
                  bucket.blob(blob_name).upload_from_filename(str(f))
                  print(f"  uploaded {blob_name}")
                  uploaded += 1
          print(f"Done: {uploaded} files uploaded to gs://{bucket_name}/{prefix}/")
          PYEOF


scheduling:
  strategy: SPOT
  disableRetries: true
  restartJobOnWorkerRestart: false
