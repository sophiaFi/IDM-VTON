# Vertex AI CustomJob spec: baseline IDM-VTON (pretrained yisol/IDM-VTON, no extension, no measurements)
# on the same FIT data used for the extensions. Uses inference_measurement_adapter.py without --checkpoint_dir.
#
# Usage:
#   gcloud ai custom-jobs create \
#       --region=europe-west4 \
#       --display-name=idm-vton-baseline-inference \
#       --config=inference_job_baseline.yaml
#
# Prerequisites: upload to gs://idm-vton-ma/scripts/
#   - inference_measurement_adapter.py
#   - gradio_demo/utils_mask_original.py  (upstream IDM-VTON mask code, from the first repo commit)
#
# Results are uploaded to gs://idm-vton-ma/baseline_run/inference_output/.

workerPoolSpecs:
  - machineSpec:
      machineType: a2-highgpu-1g
      acceleratorType: NVIDIA_TESLA_A100
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 200
    containerSpec:
      imageUri: europe-west4-docker.pkg.dev/breuni-brtn-dev/idm-vton/trainer:v8
      env:
        # First dataset index to process. Set to the number of images already
        # uploaded to resume an interrupted run (outputs go to the same GCS prefix).
        - name: START_INDEX
          value: "0"
      command:
        - /bin/bash
        - -c
        - |
          set -e

          BUCKET="ma-idm-vton"
          OUTPUT_PREFIX="baseline_run/inference_output_val"

          export BUCKET

          pip install --quiet google-cloud-storage==2.14.0 google-cloud-logging==3.9.0

          python - <<'PYEOF'
          from google.cloud import storage
          import os, pathlib, sys

          bucket_name = os.environ["BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          def download_prefix(prefix, local_root):
              prefix = prefix.rstrip("/") + "/"
              blobs = list(bucket.list_blobs(prefix=prefix))
              if not blobs:
                  print(f"ERROR: no objects found under gs://{bucket_name}/{prefix}", file=sys.stderr)
                  sys.exit(1)
              for blob in blobs:
                  rel = blob.name[len(prefix):]
                  if not rel or blob.name.endswith("/"):
                      continue
                  dest = pathlib.Path(local_root) / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  blob.download_to_filename(str(dest))
                  print(f"  downloaded {blob.name}")
              print(f"Done: {local_root}  ({len(blobs)} files)")

          download_prefix("datasets/own_data/", "/tmp/own_data")
          download_prefix("models/yisol-IDM-VTON", "/tmp/yisol-IDM-VTON")
          download_prefix("scripts", "/tmp/scripts")
          PYEOF

          cp /tmp/scripts/inference_measurement_adapter.py /app/inference_measurement_adapter.py
          cp /tmp/scripts/utils_mask_original.py /app/gradio_demo/utils_mask_original.py
          cp /tmp/scripts/counterfactual.py /app/src/counterfactual.py
          cp /tmp/scripts/fit_dataset.py /app/src/fit_dataset.py

          # Wire up /app/ckpt/* so hardcoded relative paths in humanparsing,
          # openpose, and densepose all resolve correctly.
          mkdir -p /app/ckpt
          ln -sfn /tmp/yisol-IDM-VTON/humanparsing  /app/ckpt/humanparsing
          ln -sfn /tmp/yisol-IDM-VTON/densepose     /app/ckpt/densepose
          ln -sfn /tmp/yisol-IDM-VTON/openpose      /app/ckpt/openpose

          # Background uploader: syncs new outputs to GCS every 100 finished images
          # (counted via *_mask.png, the last file written per image), then does a
          # final sync once /tmp/inference_done appears.
          cat > /tmp/upload_outputs.py <<'PYEOF'
          import pathlib, sys, time
          from google.cloud import storage

          out_dir = pathlib.Path(sys.argv[1])
          bucket_name = sys.argv[2]
          prefix = sys.argv[3].strip("/")
          every = int(sys.argv[4])
          sentinel = pathlib.Path("/tmp/inference_done")

          bucket = storage.Client().bucket(bucket_name)
          uploaded = {}

          def upload_new(settle):
              n = 0
              for f in out_dir.rglob("*"):
                  if not f.is_file():
                      continue
                  mtime = f.stat().st_mtime
                  if uploaded.get(f) == mtime:
                      continue
                  if settle and time.time() - mtime < 5:
                      continue
                  blob_name = f"{prefix}/{f.relative_to(out_dir).as_posix()}"
                  bucket.blob(blob_name).upload_from_filename(str(f))
                  uploaded[f] = mtime
                  n += 1
              return n

          next_at = every
          while True:
              if sentinel.exists():
                  if not out_dir.exists():
                      print("WARNING: inference output directory not found - inference may have failed.", file=sys.stderr)
                      sys.exit(1)
                  n = upload_new(False)
                  print(f"Final upload: {n} new files; {len(uploaded)} total in gs://{bucket_name}/{prefix}/", flush=True)
                  break
              count = len(list(out_dir.glob("*_mask.png"))) if out_dir.exists() else 0
              if count >= next_at:
                  try:
                      n = upload_new(True)
                      print(f"Checkpoint upload at {count} images: {n} new files -> gs://{bucket_name}/{prefix}/", flush=True)
                      next_at = (count // every + 1) * every
                  except Exception as e:
                      print(f"WARNING: periodic upload failed, will retry: {e}", file=sys.stderr, flush=True)
              time.sleep(20)
          PYEOF

          rm -f /tmp/inference_done
          python -u /tmp/upload_outputs.py /tmp/baseline_inference_output "$BUCKET" "$OUTPUT_PREFIX" 100 &
          UPLOADER_PID=$!

          cd /app
          # No --checkpoint_dir -> pretrained model, measurements ignored.
          # --original_mask -> upstream IDM-VTON agnostic mask (no measurement-based expansion).
          # Resolution/steps/seed match the adapter inference job for a fair comparison.
          accelerate launch \
            --num_processes=1 \
            --num_machines=1 \
            inference_measurement_adapter.py \
            --pretrained_model_name_or_path /tmp/yisol-IDM-VTON \
            --data_dir /tmp/own_data \
            --output_dir /tmp/baseline_inference_output \
            --num_samples -1 \
            --start_index "${START_INDEX:-0}" \
            --height 1024 \
            --width 768 \
            --mixed_precision fp16 \
            --num_inference_steps 30 \
            --guidance_scale 2.0 \
            --seed 42 \
            --original_mask \
            --densepose_path /tmp/yisol-IDM-VTON/densepose/model_final_162be9.pkl

          # Signal the uploader to do its final sync and wait for it.
          touch /tmp/inference_done
          wait $UPLOADER_PID


scheduling:
  strategy: SPOT
  disableRetries: true
  restartJobOnWorkerRestart: false
