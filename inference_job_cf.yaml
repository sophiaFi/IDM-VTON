# Vertex AI CustomJob spec: counterfactual measurement sweep for inference_fit.py (token extension).
#
# 30 samples (datasets/counterfactual_test) x 4 measurements x (+2sigma, -2sigma) = 240 generations, 15 steps.
# Normal generation is skipped (--cf_only); the 1000-sample results are untouched.
#
# Prerequisites:
#   - Upload the CURRENT inference_fit.py AND src/counterfactual.py to gs://idm-vton-bucket/scripts/ (as scripts/counterfactual.py).
#   - The image's src/measurement_encoder.py must define _MEASURE_MEAN / _MEASURE_STD (current repo version).
#
# Usage:
#   gcloud ai custom-jobs create \
#       --region=us-central1 \
#       --display-name=idm-vton-cf-token \
#       --config=inference_job_cf.yaml
#
# Output: gs://idm-vton-bucket/full_run_1/counterfactual/cf/<dimension>/<stem>_{plus,minus}.png
# Analyse with: python evaluate.py --result_dir <results> --data_dir <test> --cf_dir <downloaded>/cf

workerPoolSpecs:
  - machineSpec:
      machineType: a2-highgpu-1g
      acceleratorType: NVIDIA_TESLA_A100
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/idm-vton-proj/idm-vton/trainer:v6
      command:
        - /bin/bash
        - -c
        - |
          set -e

          pip install --quiet google-cloud-storage==2.14.0 google-cloud-logging==3.9.0

          python - <<'PYEOF'
          from google.cloud import storage
          import pathlib, sys

          bucket_name = "idm-vton-bucket"
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          def download_prefix(prefix, local_root):
              blobs = list(bucket.list_blobs(prefix=prefix))
              if not blobs:
                  print(f"ERROR: no objects found under gs://{bucket_name}/{prefix}", file=sys.stderr)
                  sys.exit(1)
              for blob in blobs:
                  rel = blob.name[len(prefix):]
                  if not rel:
                      continue
                  dest = pathlib.Path(local_root) / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  blob.download_to_filename(str(dest))
                  print(f"  downloaded {blob.name}")
              print(f"Done: {local_root}  ({len(blobs)} files)")

          download_prefix("datasets/counterfactual_test/", "/tmp/counterfactual_test")
          download_prefix("models/yisol-IDM-VTON/", "/tmp/yisol-IDM-VTON")
          download_prefix("scripts/",               "/tmp/scripts")
          download_prefix("ckpt/ip_adapter/",       "/tmp/ckpt/ip_adapter")
          import os
          ckpt_prefix = os.environ.get("CHECKPOINT_PREFIX", "full_run_1/checkpoint-9000") + "/"
          download_prefix(ckpt_prefix, "/tmp/checkpoint")
          PYEOF

          cp /tmp/scripts/inference_fit.py /app/inference_fit.py
          # src/ is baked into the image; the counterfactual helper is not -> upload it to scripts/
          cp /tmp/scripts/counterfactual.py /app/src/counterfactual.py

          # Wire up /app/ckpt/* so hardcoded relative paths in humanparsing,
          # openpose, and densepose all resolve correctly.
          mkdir -p /app/ckpt
          ln -sfn /tmp/yisol-IDM-VTON/humanparsing  /app/ckpt/humanparsing
          ln -sfn /tmp/yisol-IDM-VTON/densepose     /app/ckpt/densepose
          ln -sfn /tmp/yisol-IDM-VTON/openpose      /app/ckpt/openpose
          ln -sfn /tmp/ckpt/ip_adapter              /app/ckpt/ip_adapter

          accelerate launch \
            --num_processes=1 \
            --num_machines=1 \
            inference_fit.py \
            --pretrained_model_name_or_path /tmp/yisol-IDM-VTON \
            --data_dir /tmp/counterfactual_test \
            --output_dir /tmp/full_run_1/counterfactual \
            --num_samples -1 \
            --counterfactual \
            --cf_only \
            --cf_sigma 2.0 \
            --cf_dims garment_bust garment_length garment_sleeve_length body_height \
            --height 1024 \
            --width 768 \
            --mixed_precision fp16 \
            --num_inference_steps 15 \
            --guidance_scale 2.0 \
            --seed 42 \
            --checkpoint_dir /tmp/checkpoint \
            --ip_adapter_path /tmp/ckpt/ip_adapter/ip-adapter-plus_sdxl_vit-h.bin \
            --densepose_path /tmp/yisol-IDM-VTON/densepose/model_final_162be9.pkl

          python - <<'PYEOF'
          from google.cloud import storage
          import pathlib, sys

          out_dir = pathlib.Path("/tmp/full_run_1/counterfactual")
          if not out_dir.exists():
              print("WARNING: /tmp/full_run_1/counterfactual not found — inference may have failed.", file=sys.stderr)
              sys.exit(1)
          bucket = storage.Client().bucket("idm-vton-bucket")
          uploaded = 0
          for f in out_dir.rglob("*"):
              if f.is_file():
                  rel = f.relative_to(out_dir)
                  blob_name = f"full_run_1/counterfactual/{rel}".replace("\\", "/")
                  bucket.blob(blob_name).upload_from_filename(str(f))
                  print(f"  uploaded {blob_name}")
                  uploaded += 1
          print(f"Done: {uploaded} files uploaded to gs://idm-vton-bucket/full_run_1/counterfactual/")
          PYEOF


scheduling:
  strategy: SPOT
  disableRetries: true
  restartJobOnWorkerRestart: false
